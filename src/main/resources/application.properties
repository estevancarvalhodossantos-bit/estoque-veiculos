spring.application.name=estoque-veiculos

# Conexao com o MySQL (altere usuario/senha se necessario ou use a variavel DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/estoque_veiculos?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# O Hibernate cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
