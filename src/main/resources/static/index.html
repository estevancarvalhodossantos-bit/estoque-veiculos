<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estoque de Veiculos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f4f6f8; color: #222; }
    h1 { margin-top: 0; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;
           background: #fff; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    label { font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    input, select { padding: 6px; border: 1px solid #bbb; border-radius: 4px; }
    button { padding: 8px 14px; border: 0; border-radius: 4px; background: #0b5ed7; color: #fff; cursor: pointer; }
    button.sec { background: #6c757d; }
    button.del { background: #c62828; padding: 4px 8px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #0b5ed7; color: #fff; }
    #msg { margin: 10px 0; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Estoque de Veiculos</h1>

  <form id="filtros">
    <label>Marca <input name="marca" placeholder="ex.: Toyota"></label>
    <label>Modelo <input name="modelo" placeholder="ex.: Corolla"></label>
    <label>Preco minimo <input name="precoMin" type="number" step="0.01"></label>
    <label>Preco maximo <input name="precoMax" type="number" step="0.01"></label>
    <label>Ano minimo <input name="anoMin" type="number"></label>
    <label>Ano maximo <input name="anoMax" type="number"></label>
    <label>Status
      <select name="status">
        <option value="">Todos</option>
        <option>DISPONIVEL</option><option>RESERVADO</option><option>VENDIDO</option><option>DESCONTINUADO</option>
      </select>
    </label>
    <label>Tipo
      <select name="tipo">
        <option value="">Todos</option>
        <option>CARRO</option><option>MOTO</option><option>SUV</option><option>PICAPE</option><option>CAMINHAO</option>
      </select>
    </label>
    <div style="display:flex; gap:8px; align-items:flex-end;">
      <button type="submit">Filtrar</button>
      <button type="button" class="sec" id="limpar">Limpar</button>
    </div>
  </form>

  <div id="msg"></div>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>Marca</th><th>Modelo</th><th>Ano</th><th>Cor</th>
        <th>Preco</th><th>Km</th><th>Tipo</th><th>Status</th><th></th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>

  <script>
    const form = document.getElementById('filtros');
    const lista = document.getElementById('lista');
    const msg = document.getElementById('msg');
    const moeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

    async function carregar() {
      const params = new URLSearchParams();
      new FormData(form).forEach((valor, chave) => { if (valor) params.append(chave, valor); });

      const resp = await fetch('/api/veiculos?' + params.toString());
      if (!resp.ok) { msg.textContent = 'Erro ao consultar a API.'; return; }
      const veiculos = await resp.json();

      msg.textContent = veiculos.length + ' veiculo(s) encontrado(s).';
      lista.innerHTML = '';
      for (const v of veiculos) {
        const tr = document.createElement('tr');
        const campos = [v.id, v.marca, v.modelo, v.anoFabricacao, v.cor,
                        moeda.format(v.preco), v.quilometragem, v.tipo, v.status];
        for (const c of campos) {
          const td = document.createElement('td');
          td.textContent = c;
          tr.appendChild(td);
        }
        const tdAcao = document.createElement('td');
        const btn = document.createElement('button');
        btn.textContent = 'Remover';
        btn.className = 'del';
        btn.onclick = async () => {
          if (!confirm('Remover o veiculo ' + v.id + '?')) return;
          await fetch('/api/veiculos/' + v.id, { method: 'DELETE' });
          carregar();
        };
        tdAcao.appendChild(btn);
        tr.appendChild(tdAcao);
        lista.appendChild(tr);
      }
    }

    form.addEventListener('submit', (e) => { e.preventDefault(); carregar(); });
    document.getElementById('limpar').addEventListener('click', () => { form.reset(); carregar(); });
    carregar();
  </script>
</body>
</html>
